; Weby V1 - Phase 1
; Versions are pinned. Re-verify them against the PlatformIO registry before
; your first build (see docs/PHASE0_AUDIT.md section 3).

[env:esp32-s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17 / ESP-IDF 4.4.x
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; This env is the SAFE default (8MB flash, no PSRAM). It boots on any WROOM-1 variant.
; For an N16R8 module use env:esp32-s3-n16r8 below.

build_flags =
	-Isrc
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DWEBY_BRINGUP_CYCLE=1
	-Wall -Wextra

lib_deps =
	adafruit/Adafruit GFX Library@1.11.11
	adafruit/Adafruit ST7735 and ST7789 Library@1.10.4

; N16R8 = 16 MB flash + 8 MB OCTAL PSRAM (GPIO 33-37 are then internal-only).
; If this env boot-loops, the module is not N16R8: go back to env:esp32-s3.
[env:esp32-s3-n16r8]
extends = env:esp32-s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
	${env:esp32-s3.build_flags}
	-DBOARD_HAS_PSRAM

; Host-side unit tests (no hardware). Needs a native C++ compiler (gcc/clang;
; on Windows use MSYS2/MinGW or run in WSL).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
	-Isrc
	-std=gnu++11
	-Wall -Wextra
	-DUNIT_TEST
build_src_filter =
	-<*>
	+<system/state_manager.cpp>
	+<personality/emotions.cpp>
