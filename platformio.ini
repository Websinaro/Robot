[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

board_build.flash_size = 16MB

build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library
